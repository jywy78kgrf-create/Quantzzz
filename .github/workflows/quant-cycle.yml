name: Quant fund cycle

on:
  schedule:
    # market hours: hourly, Mon-Fri 13:00-21:00 UTC (9am-5pm ET)
    - cron: "47 13-21 * * 1-5"
    # off-hours + weekends: every 6 hours — research keeps grinding 24/7
    - cron: "13 1,7 * * *"
    - cron: "13 13,19 * * 0,6"
  workflow_dispatch: {}              # manual "run a cycle now" button

permissions:
  contents: write
  issues: write

concurrency:
  group: quant-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,llm]"

      - name: Choose research depth (deep when markets are closed)
        id: depth
        run: |
          # Decide by wall-clock, not by which cron string fired — so a cycle
          # launched by the heartbeat (workflow_dispatch, empty event.schedule)
          # still runs lean+trading during market hours and deep when closed.
          H=$(date -u +%H); H=$((10#$H)); DOW=$(date -u +%u)   # hour 0-23, DOW 1-7
          if [ "$DOW" -le 5 ] && [ "$H" -ge 13 ] && [ "$H" -le 21 ]; then
            echo "iters=40" >> "$GITHUB_OUTPUT"     # market hours: fresh data + trading
          else
            echo "iters=160" >> "$GITHUB_OUTPUT"    # nights/weekends: deep search
          fi

      - name: Run one fund cycle (refresh -> research -> trade)
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          BPIQ_API_KEY: ${{ secrets.BPIQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDGAR_USER_AGENT: "Quantzzz research bot (github actions)"
          LIVE_TRADING: "false"
        run: |
          python -m quantzzz init-db   # bootstraps from data/seed.db on fresh checkout
          python -m quantzzz run --cycles 1 --research-iterations ${{ steps.depth.outputs.iters }}

      - name: Run tests (guard against bad state)
        run: python -m pytest -q

      - name: Export compact state seed (cache blobs stay local)
        run: |
          python - <<'EOF'
          import shutil, sqlite3
          src = sqlite3.connect("quantzzz.db")
          src.execute("PRAGMA wal_checkpoint(TRUNCATE)")  # flush WAL before copying
          src.close()
          shutil.copy("quantzzz.db", "data/seed.db")
          conn = sqlite3.connect("data/seed.db")
          conn.execute("DELETE FROM api_cache")
          # equity curves dominate seed size; keep them only for promoted
          # strategies and the freshest iterations (labs show recent search)
          conn.execute("""
            UPDATE research_iterations SET equity_curve_json=NULL
            WHERE equity_curve_json IS NOT NULL
              AND strategy_id NOT IN (SELECT id FROM strategies WHERE status='promoted')
              AND id < (SELECT MAX(id) FROM research_iterations) - 2000""")
          conn.commit()
          conn.execute("VACUUM")
          conn.close()
          EOF

      - name: Commit updated state
        run: |
          git config user.name "quantzzz-bot"
          git config user.email "quantzzz-bot@users.noreply.github.com"
          git add data/seed.db data/snapshots
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Automated fund cycle: $(date -u +%Y-%m-%dT%H:%MZ)"
            # the branch may have moved during the cycle (a code push mid-run);
            # rebase our state commit on top and keep this run's seed/snapshots
            # (-X theirs = our commit's files win any conflict during rebase)
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || exit 1
            done
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label cycle-failure --state open --json number --jq length)
          if [ "${open:-0}" = "0" ]; then
            gh label create cycle-failure --color B60205 --force || true
            gh issue create --title "Fund cycle failed: $(date -u +%FT%H:%MZ)" \
              --label cycle-failure \
              --body "A scheduled fund cycle failed. Check the Actions run logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
