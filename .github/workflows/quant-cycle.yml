name: Quant fund cycle

on:
  schedule:
    - cron: "30 13,17,21 * * 1-5"   # 3x per US trading day (UTC), Mon-Fri
  workflow_dispatch: {}              # manual "run a cycle now" button

permissions:
  contents: write

concurrency:
  group: quant-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run one fund cycle (refresh -> research -> trade)
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          BPIQ_API_KEY: ${{ secrets.BPIQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDGAR_USER_AGENT: "Quantzzz research bot (github actions)"
          LIVE_TRADING: "false"
        run: |
          python -m quantzzz init-db
          python -m quantzzz run --cycles 1 --research-iterations 40

      - name: Run tests (guard against bad state)
        run: python -m pytest -q

      - name: Prune expired cache (keep the repo lean)
        run: |
          python - <<'EOF'
          import sqlite3
          conn = sqlite3.connect("quantzzz.db")
          conn.execute("DELETE FROM api_cache WHERE datetime(fetched_at, '+' || ttl_s || ' seconds') < datetime('now')")
          conn.commit()
          conn.execute("VACUUM")
          conn.close()
          EOF

      - name: Commit updated state
        run: |
          git config user.name "quantzzz-bot"
          git config user.email "quantzzz-bot@users.noreply.github.com"
          git add -f quantzzz.db data/snapshots
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Automated fund cycle: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
