[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-firewall"
version = "0.1.0"
description = "Off-Objective Procurement Firewall: a deterministic gate + advisory semantic judge for autonomous procurement agents"
requires-python = ">=3.11"
# The deterministic gate, CLI, and eval harness use only the standard library.
# The LLM-backed judge needs the Anthropic SDK; tests need pytest.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.69,<1.0"]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["firewall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B007", "B023", "B905"]
