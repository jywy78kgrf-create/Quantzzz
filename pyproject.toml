[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantzzz"
version = "0.1.0"
description = "Autonomous AI quant fund: iterative strategy research desks, paper-trading agents, and dashboards"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "pyarrow>=14.0",
    "streamlit>=1.36",
    "plotly>=5.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["quantzzz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
